server {
  listen 8180;

  location /kai/node/ {
    proxy_pass http://localhost:9100/;
  }

  location /kai/model/ {
    proxy_pass http://kai-gateway-upstream/;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_pass_header X-Gateway-Backend;
  }
}
